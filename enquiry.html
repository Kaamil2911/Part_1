<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enquire | Crème de la Crème</title>
    <link rel="stylesheet" href="index.css">
    <script src="JS/javascript.js" defer></script>
</head>
<body style="background-color: rgb(85, 18, 18);">

    <section class="form-section">
        <h2>Request a Bakery Service</h2>
        <p>Enquire about catering, specialty cakes, or partnerships.</p>

        <form id="enquiryForm" action="/mock-api-endpoint">
            <div class="form-group">
                <label for="enqName">Full Name</label>
                <input type="text" id="enqName" required minlength="3">
                <div class="error-message" id="enqNameError">Please enter a valid name.</div>
            </div>

            <div class="form-group">
                <label for="enqPhone">Phone Number</label>
                <input type="tel" id="enqPhone" pattern="[0-9]{10}" required>
                <div class="error-message" id="enqPhoneError">Please enter a valid 10-digit phone number.</div>
            </div>

            <div class="form-group">
                <label for="enqService">Service Required</label>
                <select id="enqService" required>
                    <option value="">-- Select an Option --</option>
                    <option value="catering">Event Catering</option>
                    <option value="wedding_cake">Wedding Cake Consultation</option>
                    <option value="wholesale">Wholesale Supply</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Check Availability via AJAX</button>
        </form>

        <div id="enquiryResponse" class="success-box"></div>
    </section>

</body>
</html>
